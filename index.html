<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML com JS</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h1>Números</h1>
        <br>
        <h2>Digite dois números sendo que o segundo seja maior que o primeiro.</h2>
        <form id="form-numero">
            <input type="number" id = "campo-A" required placeholder="Número A" />
            <input type="number" id = "campo-B" required placeholder="Número B" />
           
            <button type="submit">Verificar</button> 
                        
        </form>

        <p class="error-message"></p> 
        <p class="sucess-message"></p> 
    </div>

    <script src="./main.js"></script>
</body>
</html>
